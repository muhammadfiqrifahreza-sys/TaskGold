<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskGold - Kanban Tugas Kuliah</title>
    <link rel="stylesheet" href="style_Kanban.css">
</head>
<body data-view="board">
  <aside class="sidebar">
    <div class="logo"><span class="logo-mark">T</span><span>TaskGold</span></div>
    <nav aria-label="Menu utama">
      <a href="#" data-view="board">Papan Tugas</a>
      <a href="#" data-view="stat">Statistik</a>
      <a href="#" data-view="course">Mata Kuliah</a>
      <a href="#" data-soon>Pengaturan</a>
    </nav>
  </aside>

  <div class="app">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Papan Tugas</h1>
        <p id="pageSub"></p>
      </div>
      <div class="actions">
        <label class="search"><span class="sr">Cari tugas</span>
          <input type="search" id="search" placeholder="Cari tugas..."></label>
        <button class="btn primary" id="btnAdd" type="button">+ Tambah Tugas</button>
      </div>
    </header>

    <main>
      <!-- Papan Tugas -->
      <section class="view" id="view-board" aria-label="Papan Tugas">
        <div class="stats"></div>
        <section class="filters" aria-label="Filter mata kuliah">
          <span>Mata kuliah</span><div id="chips" class="chips"></div>
        </section>

        <div class="tabs" id="tabs" role="tablist" aria-label="Status tugas"></div>
        <section class="board" id="board" aria-label="Papan kanban">
          <article class="column" data-status="todo" aria-labelledby="h-todo">
            <header><h2 id="h-todo"><i class="dot"></i>To Do</h2><span class="count"></span></header>
            <div class="list" data-status="todo"></div>
            <button class="ghost" type="button" data-add="todo">+ Tambah kartu</button>
          </article>

          <article class="column" data-status="prog" aria-labelledby="h-prog">
            <header><h2 id="h-prog"><i class="dot"></i>In Progress</h2><span class="count"></span></header>
            <div class="list" data-status="prog"></div>
            <button class="ghost" type="button" data-add="prog">+ Tambah kartu</button>
          </article>

          <article class="column" data-status="done" aria-labelledby="h-done">
            <header><h2 id="h-done"><i class="dot"></i>Done</h2><span class="count"></span></header>
            <div class="list" data-status="done"></div>
            <button class="ghost" type="button" data-add="done">+ Tambah kartu</button>
          </article>
        </section>
        <footer>Tip: seret kartu antar kolom, atau tekan "Pindah" di layar sentuh.</footer>
      </section>

      <!-- Statistik -->
      <section class="view" id="view-stat" aria-label="Statistik">
        <div class="stats"></div>
        <article class="panel"><h2>Status tugas</h2><div class="stack" id="stack"></div><div class="status-cards" id="statusCards"></div></article>
        <article class="panel"><h2>Deadline terdekat</h2><ul class="deadlines" id="deadlines"></ul></article>
      </section>

      <!-- Mata Kuliah -->
      <section class="view" id="view-course" aria-label="Mata Kuliah">
        <div class="courses" id="courses"></div>
      </section>
    </main>
  </div>

  <button class="fab" id="fab" type="button" aria-label="Tambah tugas">+</button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="addDlg">
    <form id="addForm" novalidate>
      <h2>Tambah Tugas Baru</h2>
      <label>Judul Tugas<input name="title" id="fTitle" placeholder="Contoh: Laporan Praktikum" required></label>
      <label>Mata Kuliah<input name="course" list="courseList" placeholder="Contoh: Basis Data" required>
        <datalist id="courseList"></datalist></label>
      <div class="row">
        <label>Tenggat<input type="date" name="due" required></label>
        <label>Status Awal
          <select name="status"><option value="todo">To Do</option><option value="prog">In Progress</option><option value="done">Selesai</option></select></label>
      </div>
      <label>Jumlah Subtugas<input type="number" name="total" min="1" max="20" value="3"></label>
      <p class="error" id="formError" role="alert"></p>
      <div class="foot">
        <button type="button" class="btn ghost-btn" id="btnCancel">Batal</button>
        <button type="submit" class="btn primary">Simpan Tugas</button>
      </div>
    </form>
  </dialog>

  <dialog id="moveDlg">
    <h2>Pindahkan Tugas</h2>
    <p id="moveTitle"></p>
    <div id="moveOpts" class="opts"></div>
    <button type="button" class="btn ghost-btn" id="moveClose">Tutup</button>
  </dialog>

  <script src="script_Kanban.js"></script>
</body>
</html>
